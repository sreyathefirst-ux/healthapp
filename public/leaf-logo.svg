<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 175">
  <defs>
    <linearGradient id="leafGrad" x1="5%" y1="5%" x2="95%" y2="95%">
      <stop offset="0%"   stop-color="#55F0A8"/>
      <stop offset="25%"  stop-color="#5DDAB8"/>
      <stop offset="52%"  stop-color="#78C8EC"/>
      <stop offset="78%"  stop-color="#9278E8"/>
      <stop offset="100%" stop-color="#B060EC"/>
    </linearGradient>
    <clipPath id="lc">
      <path d="M 112 12 C 152 42, 148 132, 48 162 C -4 130, 18 30, 112 12 Z"/>
    </clipPath>
  </defs>

  <!-- Two-curve leaf: sharp tip at top-right (112,12) and bottom-left (48,162) -->
  <path d="M 112 12 C 152 42, 148 132, 48 162 C -4 130, 18 30, 112 12 Z"
        fill="url(#leafGrad)"/>

  <!-- White diagonal highlight swoosh -->
  <path d="M 68 14 C 86 55, 90 110, 78 164"
        fill="none"
        stroke="white"
        stroke-width="22"
        stroke-linecap="round"
        opacity="0.75"
        clip-path="url(#lc)"/>
</svg>
