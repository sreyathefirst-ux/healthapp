<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="leafGrad" x1="5%" y1="5%" x2="95%" y2="95%">
      <stop offset="0%"   stop-color="#52F0A4"/>
      <stop offset="28%"  stop-color="#5DDAB8"/>
      <stop offset="55%"  stop-color="#74C8EC"/>
      <stop offset="80%"  stop-color="#9280E8"/>
      <stop offset="100%" stop-color="#B068E8"/>
    </linearGradient>
    <clipPath id="leafClip">
